<!DOCTYPE html>
<html>
<head>
<title>Detection Result</title>

<style>

body{
font-family: Arial;
background:#f4f4f4;
text-align:center;
}

.container{
margin-top:100px;
background:white;
padding:40px;
width:400px;
margin-left:auto;
margin-right:auto;
border-radius:10px;
box-shadow:0px 0px 10px rgba(0,0,0,0.1);
}

.result{
font-size:22px;
margin-top:20px;
}

.confidence{
font-size:18px;
color:#555;
margin-top:10px;
}

button{
margin-top:30px;
padding:10px 20px;
background:#007BFF;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

</style>
</head>

<body>

<div class="container">

<h2>Detection Result</h2>

<div class="result">
Prediction: <b>{{ prediction }}</b>
</div>

<div class="confidence">
Confidence: {{ confidence }}%
</div>

<a href="/">
<button>Try Again</button>
</a>

</div>

</body>
</html>
