<!DOCTYPE html>
<html>
<head>
<title>AI Voice Detection</title>

<style>

body{
font-family: Arial;
text-align:center;
background:#f4f4f4;
}

.container{
margin-top:100px;
background:white;
padding:40px;
width:400px;
margin-left:auto;
margin-right:auto;
border-radius:10px;
box-shadow:0px 0px 10px rgba(0,0,0,0.1);
}

button{
padding:10px 20px;
background:#007BFF;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

</style>

</head>

<body>

<div class="container">

<h2>AI Voice Detection</h2>

<p>Upload voice file (.wav)</p>

<form action="/predict_voice" method="post" enctype="multipart/form-data">

<input type="file" name="audio" accept=".wav" required>

<br><br>

<button type="submit">Detect Voice</button>

</form>

</div>

</body>
</html>
